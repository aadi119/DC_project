<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RailNet Ops</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topnav">
    <a class="logo" href="#/network" aria-label="RailNet Ops home">
      <span class="logo-mark">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 24 C 12 8, 20 8, 26 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="6" cy="24" r="3.2" fill="currentColor"/><circle cx="26" cy="24" r="3.2" fill="currentColor"/><circle cx="16" cy="12.2" r="3.2" fill="#0b1220" stroke="currentColor" stroke-width="2.2"/></svg>
      </span>
      <span class="logo-text">RailNet<b>OPS</b></span>
    </a>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="top-right">
      <span class="clock mono" id="clock">--:--:--</span>
      <span class="sync-pill" id="sync-pill"><i></i><span>connecting</span></span>
      <label class="switch" title="Keep traffic flowing automatically">
        <input type="checkbox" id="autopilot"><span class="track"><span class="knob"></span></span><span class="switch-label">Autopilot</span>
      </label>
      <button class="icon-btn" id="logs-btn" title="Live system logs">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 8l2.5 2L6 12M10.5 12.5h3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>Logs</span>
      </button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <section class="drawer" id="logs" aria-label="Live system logs">
    <div class="drawer-head">
      <b>System logs</b><span class="dim">live output of the RailNet backend</span>
      <span class="grow"></span>
      <label class="mini-check"><input type="checkbox" id="logs-follow" checked> follow</label>
      <button class="ghost-btn" id="logs-clear">Clear</button>
      <button class="ghost-btn" id="logs-close">Close</button>
    </div>
    <pre id="logs-body"></pre>
  </section>

  <div id="toasts" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/network-map.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
